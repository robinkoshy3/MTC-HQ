<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rooted: Learn the Holy Qurbana</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a lesson path (home) and a one-card-at-a-time lesson player with 5 stages: See, Guess, Why, Check, Sunday. Jesus' story lights up as lessons are finished. */
:root{
  --bg:#f7f6f2; --surface:#ffffff; --ink:#1e2320; --muted:#5d655f; --line:#e1e0d9;
  --vine:#2f5d3e; --vine-soft:#e8efe9; --altar:#8a1f2b; --altar-soft:#f6e9ea; --good:#2e7d4f; --bad:#b3261e;
  --display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --body:"Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131614; --surface:#1b1f1c; --ink:#e8ece9; --muted:#a3aca6; --line:#2d3430;
    --vine:#86b994; --vine-soft:#1f2b23; --altar:#e3808a; --altar-soft:#2e1f22; --good:#6cc792; --bad:#ef6b62; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131614; --surface:#1b1f1c; --ink:#e8ece9; --muted:#a3aca6; --line:#2d3430;
  --vine:#86b994; --vine-soft:#1f2b23; --altar:#e3808a; --altar-soft:#2e1f22; --good:#6cc792; --bad:#ef6b62; color-scheme: dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--vine);outline-offset:2px}
a{color:var(--vine)}
.wrap{max-width:680px;margin:0 auto;padding:24px 16px 60px}
.eyebrow{font-size:.76rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--altar)}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2rem,7vw,2.7rem);line-height:1.05;margin:4px 0 8px;text-wrap:balance}
.lead{margin:0 0 18px;color:var(--muted)}
.btn{border:0;background:var(--vine);color:var(--surface);border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;font-size:1rem}
.btn.ghost{background:transparent;color:var(--vine);border:1.5px solid var(--vine)}
.btn:disabled{opacity:.4;cursor:default}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
/* Home */
.hero{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.progress{font-size:.92rem;color:var(--muted)}
.progress b{color:var(--ink);font-variant-numeric:tabular-nums}
.story h2,.path h2{font-family:var(--display);font-size:1.35rem;margin:0 0 2px}
.story p{margin:0 0 12px;font-size:.92rem;color:var(--muted)}
.evrow{display:flex;flex-wrap:wrap;gap:6px}
.ev{border:1.5px dashed var(--line);border-radius:999px;padding:3px 11px;font-size:.86rem;font-weight:600;color:var(--muted);background:var(--bg)}
.ev.on{border:1.5px solid var(--altar);background:var(--altar);color:var(--surface)}
.ev.later{opacity:.7}
.path{margin-top:16px}
.part{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.lesson{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.lesson:hover{border-color:var(--vine)}
.lesson .dot{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;border:2px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.lesson.done .dot{background:var(--vine);border-color:var(--vine);color:var(--surface)}
.lesson.next{border-color:var(--vine);box-shadow:0 0 0 1px var(--vine)}
.lesson.next .dot{border-color:var(--vine);color:var(--vine)}
.lesson .t{font-weight:700;line-height:1.2}
.lesson .s{font-size:.85rem;color:var(--muted)}
.lesson .go{margin-left:auto;font-size:.82rem;font-weight:700;color:var(--vine);white-space:nowrap}
/* Player */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back{border:0;background:none;color:var(--vine);font-weight:700;cursor:pointer;padding:4px 0}
.bar{flex:1;display:flex;gap:4px}
.bar i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.bar i.on{background:var(--vine)}
.stage-label{font-size:.76rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--altar);margin-bottom:4px}
.player h2{font-family:var(--display);font-size:clamp(1.6rem,6vw,2.1rem);line-height:1.1;margin:0 0 12px;text-wrap:balance}
.big{font-size:1.12rem;margin:0 0 12px}
.words{border-left:4px solid var(--altar);padding:4px 0 4px 14px;margin:10px 0 0}
.words q{font-family:var(--display);font-size:1.3rem;line-height:1.35;quotes:"“" "”"}
.words small{display:block;color:var(--muted);font-size:.82rem;margin-top:4px}
.opts{display:grid;gap:8px;margin:12px 0}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--vine)}
.opt b{display:block}
.opt span{color:var(--muted);font-size:.92rem}
.opt.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 10%,var(--surface))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
.opt:disabled{cursor:default}
.feedback{border-radius:12px;padding:12px 14px;margin-top:4px}
.feedback.good{background:color-mix(in srgb,var(--good) 12%,var(--surface))}
.feedback.bad{background:color-mix(in srgb,var(--bad) 9%,var(--surface))}
.feedback strong{display:block;margin-bottom:2px}
.verse{background:var(--vine-soft);border-radius:12px;padding:14px 16px;margin-top:10px}
.verse q{display:block;font-family:var(--display);font-style:italic;font-size:1.25rem;line-height:1.4;quotes:none}
.verse .ref{margin-top:6px;font-weight:700;font-size:.9rem;color:var(--vine);display:flex;gap:10px}
.verse .ref a{font-weight:600;font-size:.82rem}
details.deeper{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
details.deeper summary{cursor:pointer;font-weight:700;color:var(--vine)}
.lit{background:var(--bg);border-radius:8px;padding:10px 12px;margin:8px 0;font-size:.93rem;white-space:pre-line}
.lit .sn{font-size:.7rem;font-weight:700;background:var(--ink);color:var(--surface);border-radius:4px;padding:0 6px}
.lit .P{color:var(--altar)}
.more{margin:6px 0 0;padding-left:18px;font-size:.93rem}
.watch{background:var(--altar-soft);border-radius:12px;padding:16px;font-size:1.12rem}
.unlock{margin-top:14px;font-size:.95rem}
.unlock .ev{margin:4px 4px 0 0;display:inline-block}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
.nav .btn{flex:1}
.talk{margin-top:14px;font-size:.95rem;color:var(--muted)}
/* Deep dive */
.pill{font-size:.72rem;font-weight:700;background:var(--altar-soft);color:var(--altar);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.deepcta{margin-top:16px;border:1.5px dashed var(--altar);border-radius:12px;padding:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.deepcta p{margin:0;font-size:.95rem}
.btn.altar{background:var(--altar)}
.chain{position:relative;margin:8px 0 6px;padding-left:28px}
.chain::before{content:"";position:absolute;left:9px;top:8px;bottom:8px;width:3px;border-radius:2px;background:linear-gradient(var(--vine),var(--altar))}
.link{position:relative;margin-bottom:16px}
.link::before{content:"";position:absolute;left:-26px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--surface);border:3px solid var(--vine)}
.link.ours::before{border-color:var(--altar);background:var(--altar)}
.link .k{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--vine)}
.link.ours .k{color:var(--altar)}
.link .r{font-weight:700;margin-left:6px;font-size:.9rem}
.link q{display:block;font-family:var(--display);font-style:italic;font-size:1.18rem;line-height:1.38;quotes:none;margin:4px 0}
.link.ours q{font-style:normal}
.link p{margin:0;font-size:.95rem;color:var(--muted)}
.box{background:var(--bg);border-radius:12px;padding:12px 14px;margin-top:12px}
.box h3{margin:0 0 6px;font-size:.76rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.box dl{margin:0}.box dt{font-weight:700;font-family:var(--display);font-size:1.2rem}.box dd{margin:0 0 8px}
.box p{margin:0}
.review{font-size:.8rem;color:var(--muted);margin-top:12px}
footer{margin-top:30px;font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const MOMENTS = [{"id": "entering", "part": "Gathering and First Readings", "name": "Entering the Sanctuary", "slides": [4], "kids": "When we walk into church, we are coming home to God, like the lost son in Jesus' story who came home to his father.", "teens": "The first prayer is a personal one, said quietly as you enter. It borrows the picture of the prodigal son (Luke 15): we come in not because we deserve to, but because the Father welcomes us home.", "action": "Each person prays quietly on entering, before the service begins.", "discuss": "The prodigal son rehearsed a speech, but his father cut him off with a hug. What do you 'rehearse' before coming to God?", "slideData": [{"n": 4, "title": "Personal Prayer to be said on entering the Sanctuary", "text": "O God, I have entered Your house and I have come before Your throne. Heavenly King, forgive all the sins\nI have committed against You. O God, because You are most merciful, have mercy on me and accept me just as the prodigal son was accepted. Amen.", "why": "We come in like the prodigal son coming home, trusting the Father to run out and welcome us.", "links": [{"to": "Luke 15:20-24", "l": "E"}, {"to": "Psalm 5:7", "l": "E"}]}], "links": [{"to": "Luke 15:20-24", "l": "E", "note": ""}, {"to": "Psalm 5:7", "l": "E", "note": ""}]}, {"id": "lessons", "part": "Gathering and First Readings", "name": "First and Second Lessons", "slides": [8, 10], "kids": "We hear one reading from the Old Testament and one from the New Testament, because the whole Bible tells one story about Jesus.", "teens": "The Old Testament reading comes first, then the New. Jesus Himself taught that 'Moses and all the prophets' point to Him (Luke 24:27), so the readings are meant to be heard together.", "action": "Lay readers read the lessons for the day.", "discuss": "Can you find a link between this week's Old Testament and New Testament readings?", "slideData": [{"n": 8, "title": "First Lesson – <Bible Reference>", "text": "<Insert the Old Testament Reading>", "why": "Jesus explained Himself from 'Moses and all the prophets'. All Scripture, Old and New, is God-breathed.", "links": [{"to": "Luke 24:27", "l": "E"}, {"to": "2 Timothy 3:16", "l": "S"}]}, {"n": 10, "title": "Second Lesson – <Bible Reference>", "text": "<Insert the New Testament Reading>", "why": "The first church 'continued stedfastly in the apostles' doctrine'.", "links": [{"to": "Acts 2:42", "l": "C"}, {"to": "2 Timothy 3:16", "l": "S"}]}], "links": [{"to": "Acts 2:42", "l": "C", "note": ""}, {"to": "Luke 24:27", "l": "E", "note": ""}, {"to": "2 Timothy 3:16", "l": "S", "note": ""}, {"to": "synagogue", "l": "S", "note": "Reading Scripture aloud together comes from synagogue worship"}]}, {"id": "light", "part": "Preparing to Hear", "name": "Invocation: Jesus, Light of Light", "slides": [13], "kids": "The first words we sing come from the Bible: 'In thy light shall we see light' (Psalm 36:9). God the Father is light, Jesus is light, and the Holy Spirit is light. They are three, but one God, the way three lamps in a room make one light.", "teens": "The opening line quotes Psalm 36:9: 'In thy light shall we see light.' The early church read this verse as a picture of the Trinity. Gregory of Nazianzus (4th century) put it this way: we see the Son's light, from the Father's light, in the light of the Spirit. Three, yet one light and one God. Later in the same service, the Nicene Creed calls Jesus 'Light of light' and uses the same picture.", "action": "Priest and congregation sing alternate verses. This is one of three invocations a parish can choose from.", "discuss": "We sing 'light' here and say 'Light of light' in the Creed. Where else in the service do you hear the Father, Son and Holy Spirit named together?", "slideData": [{"n": 13, "title": "Invocation 2 –  Jesus, Light of Light", "text": "(The Musical Score is on Page 136)\nP.  In Your light we see the light, Jesus full of light.\nIt’s Your light that shines upon our world. Light our minds\nMay Your light reveal the sin in our hearts\nAs we humbly pray,\nIn spirit and truth.\nC. Pure and holy One who dwells on high, in mansions of light.\nCleanse our hearts and souls. We lift them up unto You.\nGrant us purity of thought and mind,\nThat our prayers\nMay rise up to You.", "why": "Quoted from Psalm 36:9. In the psalm itself, God is the source of life and light. The early church, especially Gregory of Nazianzus in the 300s, read the verse as a picture of the Trinity.", "links": [{"to": "Psalm 36:9", "l": "Q"}]}], "links": [{"to": "Psalm 36:9", "l": "Q", "note": "Quoted from Psalm 36:9. In the psalm itself, God is the source of life and light. The early church, especially Gregory of Nazianzus in the 300s, read the verse as a picture of the Trinity."}]}, {"id": "antecommunion", "part": "Preparing to Hear", "name": "The Ante-Communion Hymn", "slides": [14], "kids": "This prayer tells the whole story of Jesus in a few lines: God's Son became a baby, died for us, and beat death.", "teens": "This is a short gospel summary. The Word became flesh (John 1:14), emptied Himself (Philippians 2), and 'through death' destroyed the one who had the power of death (Hebrews 2:14). 'Trampled our death by Your death' is one of the oldest Christian ways of saying it.", "action": "The priest begins, and the congregation responds with the hymn.", "discuss": "Which line of this hymn would you choose to explain Christmas and Easter to a friend?", "slideData": [{"n": 14, "title": "The Ante-Communion", "text": "P. O Lord Jesus Christ, incarnate of Mary and baptised by John, shower Your blessings on us.\nC. O Lord our King, the Word and the only begotten Son of the heavenly Father, we praise You. O Lord our Messiah, though You are immortal in nature, in Your grace, You became incarnate of the blessed Virgin Mary, for the life and salvation of all humanity. Without change of nature, You became the Son of Man, were crucified for us, trampled our death by Your death and destroyed it forever. O Lord our Messiah, who is One in the Holy Trinity, and is worshipped and glorified equally with Your Father and Your living and Holy Spirit, have mercy on us all. Amen.", "why": "A summary of the gospel: the eternal Word became flesh, died for us, and by His death destroyed the power of death.", "links": [{"to": "John 1:14", "l": "E"}, {"to": "Hebrews 2:14", "l": "E"}, {"to": "Philippians 2:6-8", "l": "E"}]}], "links": [{"to": "John 1:14", "l": "E", "note": ""}, {"to": "Hebrews 2:14", "l": "E", "note": ""}, {"to": "Philippians 2:6-8", "l": "E", "note": ""}]}, {"id": "trisagion", "part": "Preparing to Hear", "name": "The Trisagion", "slides": [15], "kids": "We sing 'Holy' three times, like the angels did when the prophet Isaiah saw God in the temple.", "teens": "The Trisagion ('thrice holy') is an early church hymn from about the 400s. It echoes the angels' cry in Isaiah 6 and Revelation 4. 'Crucified for us' points it straight to Jesus. 'Lord, have mercy' is the cry of the blind men in Matthew 20. It is church tradition, tested against Scripture and kept.", "action": "Said three times, priest and congregation alternating.", "discuss": "When Isaiah saw how holy God is, his first words were 'Woe is me!' What would it look like to say 'holy' and really mean it?", "slideData": [{"n": 15, "title": "The Ante-Communion", "text": "P. \tHoly art Thou, O God.*\nC. \tHoly art Thou, Almighty Lord.*\nP. \tHoly art Thou, Immortal Lord.*\nC. \tO Lord the Messiah who was crucified ✝ for us,\nhave mercy on us.*\n(*To be said three times)\nP. \tLord, have mercy.*\nLord, have mercy.*\n(*To be said three times)", "why": "An early church hymn (about the 400s) that echoes the angels' 'Holy, holy, holy'. 'Crucified for us' points it to Jesus. 'Lord, have mercy' is the cry of the blind men in Matthew 20.", "links": [{"to": "Isaiah 6:3", "l": "E"}, {"to": "Revelation 4:8", "l": "E"}, {"to": "Matthew 20:30-31", "l": "E"}, {"to": "stjames", "l": "T"}]}], "links": [{"to": "Isaiah 6:3", "l": "E", "note": ""}, {"to": "Revelation 4:8", "l": "E", "note": ""}, {"to": "Matthew 20:30-31", "l": "E", "note": ""}, {"to": "stjames", "l": "T", "note": ""}]}, {"id": "epistle", "part": "The Word", "name": "The Epistle", "slides": [16, 17, 19], "kids": "We read a letter from one of the apostles. These letters were written to churches, so they are written to us too.", "teens": "The deacon quotes Paul directly (Galatians 1:8): no other gospel. Then we pray for understanding (Psalm 119:18) and read the letter aloud, just as Paul asked the churches to do (Colossians 4:16).", "action": "The deacon introduces the reading, and the Epistle is read.", "discuss": "If Paul wrote a letter to our church today, what do you think he would say?", "slideData": [{"n": 16, "title": "<Insert the Theme for the Day>", "text": "D. The blessed Apostle Paul says, “If we or an angel from heaven, should preach a gospel to you, contrary to the gospel we preached to you, he shall be accursed.” Various kinds of teachings spring up in all quarters but blessed is he who begins and ends in the teaching of God.\nP. \tO Lord God, accept the prayers and petitions that we offer in Your holy presence at this time. O Lord our God, make us always worthy to observe in purity and holiness, Your precepts and those of Your holy apostles, and of Your Apostle Paul, the architect and builder of Your holy Church.\nC.  Amen.", "why": "The deacon quotes Paul directly: no other gospel. Paul calls himself a 'wise masterbuilder' of the church in 1 Corinthians 3.", "links": [{"to": "Galatians 1:8", "l": "Q"}, {"to": "1 Corinthians 3:10", "l": "E"}]}, {"n": 17, "title": "<Insert the Theme for the Day>", "text": "D.  From the Epistle of _________ to the _________\nC. Praise be to You, O Lord of the apostles. O Lord, graciously grant us discernment of Your Word.", "why": "We ask God to open our understanding before we hear His word. Paul asked for his letters to be read aloud in the churches.", "links": [{"to": "Psalm 119:18", "l": "E"}, {"to": "Colossians 4:16", "l": "C"}]}, {"n": 19, "title": "The Epistle Reading – <Bible Reference>", "text": "<Insert the Epistle Reading >", "why": "Paul told the churches to read his letters aloud, and told Timothy to give attention to public reading of Scripture.", "links": [{"to": "Colossians 4:16", "l": "C"}, {"to": "1 Timothy 4:13", "l": "C"}]}], "links": [{"to": "Galatians 1:8", "l": "Q", "note": ""}, {"to": "Colossians 4:16", "l": "C", "note": ""}, {"to": "1 Timothy 4:13", "l": "C", "note": ""}, {"to": "1 Corinthians 3:10", "l": "E", "note": ""}, {"to": "Psalm 119:18", "l": "E", "note": ""}]}, {"id": "gospel", "part": "The Word", "name": "The Gospel", "slides": [20, 21, 22, 24, 25], "kids": "Everyone stands for the Gospel, because it tells Jesus' own words and story. We say 'Hallelujah' to get ready.", "teens": "The Hallelujah quotes Psalm 96. We listen in silence (Habakkuk 2:20) and stand, as Israel stood when Ezra opened the book (Nehemiah 8:5) and as Jesus stood to read in the synagogue (Luke 4:16). Afterwards we thank God for the Gospel, 'the light of the world'.", "action": "Everyone stands. The priest reads the Gospel.", "discuss": "We say 'So we believe and affirm' before the Gospel is even read. What does that say about how we listen?", "slideData": [{"n": 20, "title": "<Insert the Theme for the Day>", "text": "D.\tHallelujah! Hallelujah! Hallelujah! Ascribe to the Lord sacrifices of praise, enter His courts with offerings, and worship the Lord ‘in the splendour of His holiness’.\nC.\tHallelujah!\nP.\tO Lord God, generously grant us knowledge of Your divine Word. Fill us with the essence of Your holy Gospel, the riches of Your divine wisdom, and the gift of Your Holy Spirit. In Your grace, enable us to willingly obey Your commandments, and perfectly fulfil Your holy will. Make us worthy to receive Your blessings and mercies at all times, now and forever more.\nC. \tAmen.", "why": "'Worship the Lord in the beauty of holiness' is quoted from Psalm 96. Praise itself is called a sacrifice in Hebrews 13.", "links": [{"to": "Psalm 96:8-9", "l": "Q"}, {"to": "Psalm 100:4", "l": "E"}, {"to": "Hebrews 13:15", "l": "E"}]}, {"n": 21, "title": "<Insert the Theme for the Day>", "text": "Brothers and sisters, let us attend in silence, fear and reverence, and listen to the proclamation of the living Word of God from the holy Gospel of our Lord Jesus Christ.\nPeace be with you all. ✝\nC. \tAlong with your spirit, may the Lord God make us   also worthy to listen to His Word.", "why": "Silence before God's word (Habakkuk 2:20). 'Peace be with you' is the risen Jesus' greeting to His disciples.", "links": [{"to": "Habakkuk 2:20", "l": "S"}, {"to": "John 20:19", "l": "E"}]}, {"n": 22, "title": "<Insert the Theme for the Day>", "text": "P. \tThe holy Gospel of our Lord Jesus Christ that proclaims life and salvation to the world, as\nrecorded by the [Apostle (Matthew/John) / Evangelist (Mark/Luke)]\nC. Blessed is He who has come and is to come again. Praise to the Father who sent Him for our salvation. May His blessings be on all of us forever.\nP. In the days of Jesus the Christ our Lord God and Saviour, the Word of Life, God incarnate of the blessed Virgin Mary, [it happened in this way / He taught in this manner].\nC. So we believe and affirm.", "why": "'Blessed is He who comes' is the Palm Sunday welcome. The Father sent the Son to save the world, not to condemn it.", "links": [{"to": "Psalm 118:26", "l": "E"}, {"to": "John 3:17", "l": "E"}]}, {"n": 24, "title": "The Gospel Reading – <Bible Reference>", "text": "<Insert the Gospel Reading>", "why": "Jesus stood up to read Scripture in the synagogue. When Ezra opened the book, all the people stood. That is why we stand for the Gospel.", "links": [{"to": "Luke 4:16-21", "l": "C"}, {"to": "Nehemiah 8:5", "l": "C"}]}, {"n": 25, "title": "<Insert the Theme for the Day>", "text": "Peace be with you all. ✝\nC. And also with your spirit. We praise You O Lord, for giving us Your Gospel, which is indeed the Light of the world, so that we may be drawn closer to You. Make us worthy to glorify You through the living words of Your Gospel, which we have now heard.\nBless us O Lord. Let us stand reverently.\nLord, have mercy.", "why": "Jesus is the light of the world, and God's word is a lamp to our feet.", "links": [{"to": "John 8:12", "l": "E"}, {"to": "Psalm 119:105", "l": "E"}]}], "links": [{"to": "Psalm 96:8-9", "l": "Q", "note": ""}, {"to": "Luke 4:16-21", "l": "C", "note": ""}, {"to": "Nehemiah 8:5", "l": "C", "note": ""}, {"to": "Psalm 100:4", "l": "E", "note": ""}, {"to": "Hebrews 13:15", "l": "E", "note": ""}, {"to": "John 20:19", "l": "E", "note": ""}, {"to": "Psalm 118:26", "l": "E", "note": ""}, {"to": "John 3:17", "l": "E", "note": ""}, {"to": "John 8:12", "l": "E", "note": ""}, {"to": "Psalm 119:105", "l": "E", "note": ""}, {"to": "Habakkuk 2:20", "l": "S", "note": ""}, {"to": "synagogue", "l": "S", "note": "Public reading and standing come from synagogue worship"}, {"to": "reform1836", "l": "R", "note": "The reformers put the liturgy into the people's language"}]}, {"id": "promeon", "part": "Prayer and Incense", "name": "Promeon and the Prayer of Incense", "slides": [26, 27, 28], "kids": "The smoke of incense rising up is a picture of our prayers rising to God.", "teens": "The Promeon (preface) praises God who 'rejoices in the repentance of sinners' (Luke 15:7) and promises 'Call and I will answer' (Jeremiah 33:3) and 'knock and I will open' (Matthew 7:7). Incense is a Bible picture of prayer (Psalm 141:2; Revelation 8:3-4).", "action": "The priest offers incense while praying for forgiveness.", "discuss": "Why do you think God gave people a picture (incense) and not just words for prayer?", "slideData": [{"n": 26, "title": "Preface (Promeon)", "text": "P. \tLet us all pray to the Lord, and plead for His blessings and mercy.\nC.\tO Lord the source of all blessings, bless us and help us.\nMay we become worthy to offer You continuous praise, thanksgiving, glory, adoration and everlasting exaltation. The One who absolves us from our debts, pardons our sins, purifies the unrighteous, receives the penitent, rejoices in the repentance of sinners, yearns for the redemption of transgressors and promised, …", "why": "Heaven rejoices over one sinner who repents. We offer God a 'sacrifice of praise'.", "links": [{"to": "Luke 15:7", "l": "E"}, {"to": "Hebrews 13:15", "l": "E"}]}, {"n": 27, "title": "Preface (Promeon)", "text": "“Call and I will answer, knock and I will open and stretch forth my hand to pardon your sins and transgressions,” is worthy of praise, honour and adoration, at this time of the fulfilment of this divine sacrifice of praise, and all the days of our lives, forever more.\nC. \tAmen.", "why": "God's promise: 'Call unto me, and I will answer'. Jesus: 'Knock, and it shall be opened unto you'.", "links": [{"to": "Jeremiah 33:3", "l": "E"}, {"to": "Matthew 7:7", "l": "E"}]}, {"n": 28, "title": "Prayer of Incense (Ethra) & Prayer for Pardon & Mercy (Hosoyo)", "text": "Let us all pray to the Lord for His blessings and mercy.\nO Lord the source of all blessings, bless us and help us.\nP. \tO Lord God who alone can justify, who alone can make holy, who alone can pardon and completely remove our trespasses, in Your loving compassion, blot out my many great and innumerable sins and those of all Your faithful people. Good Lord, have mercy on us and bless us. …", "why": "Incense is a picture of prayer rising to God (Psalm 141:2, Revelation 8). 'Who can forgive sins but God alone?' (Mark 2:7). 'Blot out my transgressions' (Psalm 51).", "links": [{"to": "Psalm 141:2", "l": "S"}, {"to": "Revelation 8:3-4", "l": "S"}, {"to": "Mark 2:7", "l": "E"}, {"to": "Psalm 51:1", "l": "E"}]}], "links": [{"to": "Luke 15:7", "l": "E", "note": ""}, {"to": "Hebrews 13:15", "l": "E", "note": ""}, {"to": "Jeremiah 33:3", "l": "E", "note": ""}, {"to": "Matthew 7:7", "l": "E", "note": ""}, {"to": "Mark 2:7", "l": "E", "note": ""}, {"to": "Psalm 51:1", "l": "E", "note": ""}, {"to": "Psalm 141:2", "l": "S", "note": ""}, {"to": "Revelation 8:3-4", "l": "S", "note": ""}]}, {"id": "hosoyo", "part": "Prayer and Incense", "name": "Hosoyo: Prayer for Pardon", "slides": [29, 30], "kids": "We ask God to forgive us and to care for our families, our church and our leaders.", "teens": "The Hosoyo carries the spirit of Psalm 51, David's prayer for mercy. It asks for 'the dew' of God's mercy (Hosea 14:5) and to be counted among the 'children of peace' (Luke 10:6).", "action": "The priest prays on behalf of everyone.", "discuss": "This prayer asks for forgiveness for 'all Your faithful people', not just 'me'. Why pray for forgiveness together?", "slideData": [{"n": 29, "title": "Prayer for Pardon & Mercy (Hosoyo)", "text": "O Lord God, in Your mercy, remember us and our families, our bishops and clergy and all the faithful  children  of  Your  holy  and  glorious  Church. O Lord God, comfort our bodies, souls and spirits. Shower on us, the dew of Your mercy and compassion.\nO glorious Lord, our Lord of lords, our King and Messiah, absolve us from our sins and be our Redeemer. Answer us O Lord, and rescue us with Your help and support. O God, accept our prayers and petitions, and in Your mercy, save us from harsh punishments and the rod of anger. …", "why": "God promises to be 'as the dew' to His people. The whole prayer breathes the spirit of David's prayer for mercy in Psalm 51.", "links": [{"to": "Hosea 14:5", "l": "E"}, {"to": "Psalm 51:1-2", "l": "E"}]}, {"n": 30, "title": "Prayer for Pardon & Mercy (Hosoyo)", "text": "Make us all worthy of the blessed end that is reserved for the children of peace. Generously grant us the fullness of Christian perfection that You cherish, is pleasing to You, and befits Your divinity. We offer to You praise and thanksgiving, all the days of our lives, now and forever more.\nC. \tAmen.", "why": "'Children of peace' comes from Jesus' words in Luke 10. 'Be ye therefore perfect' (Matthew 5:48).", "links": [{"to": "Luke 10:6", "l": "E"}, {"to": "Matthew 5:48", "l": "E"}]}], "links": [{"to": "Hosea 14:5", "l": "E", "note": ""}, {"to": "Psalm 51:1-2", "l": "E", "note": ""}, {"to": "Luke 10:6", "l": "E", "note": ""}, {"to": "Matthew 5:48", "l": "E", "note": ""}]}, {"id": "sedra", "part": "Prayer and Incense", "name": "Sedra: The Long Prayer", "slides": [31, 32, 33, 34, 35], "kids": "This prayer imagines heaven's worship, with angels singing 'Holy, holy, holy', and asks Jesus to keep us safe and bring us to His great feast.", "teens": "The Sedra is packed with Bible imagery. It has Ezekiel's living creatures, Isaiah's seraphim, and Revelation 4:8 quoted word for word. It also has the shelter of Psalm 91, the wedding feast and the sheep on the King's right in Matthew 25, and the righteous shining 'as the sun' in Matthew 13:43.", "action": "The priest prays, and the congregation answers 'Amen'.", "discuss": "Count the Bible images in this prayer. Which one speaks to you most this week?", "slideData": [{"n": 31, "title": "Prayer (Sedra)", "text": "P.\tAlmighty Warrior, Omnipotent and glorious Lord God, with Your power and Your mighty arm, rescue us from the evil one and his hosts. O Lord, in Your grace, mercy and love for humanity, You took flesh of the blessed Virgin Mary and became incarnate for our sake. O Lord of lords, do not banish us from Your presence in Your heavenly abode, where Your greatness is extolled by the four-faced beings who are tied to Your chariots, the company of the angels and archangels who praise Your divinity, the array of cherubim who bless, praise and glorify Your power, …", "why": "The 'four-faced beings' are the living creatures Ezekiel saw around God's throne. The seraphim come from Isaiah 6.", "links": [{"to": "Ezekiel 1:5-10", "l": "E"}, {"to": "Isaiah 6:2", "l": "E"}, {"to": "Psalm 89:13", "l": "E"}]}, {"n": 32, "title": "Prayer (Sedra)", "text": "the six-winged seraphim who celebrate and proclaim aloud Your holiness and say, “Holy, Holy, Holy, is the Lord God Almighty”, and all the hosts, ranks and companies who worship Your awesome unity of substance with Your Father. Show us the way of life and salvation, so that we may persevere and attain Your glorious kingdom. O Lord, we thank You for Your graciousness, and pray and plead for Your compassion. O Lord Jesus Christ, have mercy on us and help us. Lord Jesus Christ, look upon us with the eye of Your mercy. …", "why": "'Holy, Holy, Holy, Lord God Almighty' is quoted from Revelation 4:8.", "links": [{"to": "Revelation 4:8", "l": "Q"}, {"to": "Isaiah 6:3", "l": "E"}]}, {"n": 33, "title": "Prayer (Sedra)", "text": "Lord Jesus Christ, save us from our enemies and keep us under the shadow of Your cross. Lord Jesus Christ, deliver us from all the deceits of the evil one, prevent us from falling into the degradation of sin, and lift us from the pits of danger. Lord Jesus Christ, save us from all evil thoughts, impurity and blasphemy. Wash away all loathsome filth and stains, and wipe away all evil and wickedness from us. …", "why": "Shelter under God's shadow (Psalm 91), lifted out of the pit (Psalm 40), delivered from the evil one (the Lord's Prayer).", "links": [{"to": "Psalm 91:1", "l": "E"}, {"to": "Psalm 40:2", "l": "E"}, {"to": "Matthew 6:13", "l": "E"}]}, {"n": 34, "title": "Prayer (Sedra)", "text": "Lord Jesus Christ, satisfy us with Your goodness and blessings, and enrich us from the treasury of Your bountiful blessings and mercy. Lord Jesus Christ, allow us to rejoice in Your joyful bridal chamber. Make us rejoice with all the servants and guests who are the children of Your kingdom. Lord Jesus Christ, invite us also, with all the righteous and the saints who are Your beloved. Keep us in the ranks of Your children who are the lambs on Your right. …", "why": "The wedding feast of the kingdom, and the sheep on the King's right hand, both from Jesus' parables in Matthew 25.", "links": [{"to": "Matthew 25:10", "l": "E"}, {"to": "Matthew 25:33", "l": "E"}]}, {"n": 35, "title": "Prayer (Sedra)", "text": "Lord Jesus Christ, on the day when Your magnificence is revealed, make us radiant together with the saints and the chosen ones, and give us a place on Your right at that divine banquet. We will always ascribe praise and thanksgiving to You, to the Father and to the Holy Spirit, now and forever more.\nC.\tAmen. May the Lord accept your worship and help us by your prayers.", "why": "'Then shall the righteous shine forth' (Matthew 13:43). The marriage supper of the Lamb (Revelation 19:9).", "links": [{"to": "Matthew 13:43", "l": "E"}, {"to": "Revelation 19:9", "l": "E"}]}], "links": [{"to": "Revelation 4:8", "l": "Q", "note": ""}, {"to": "Ezekiel 1:5-10", "l": "E", "note": ""}, {"to": "Isaiah 6:2", "l": "E", "note": ""}, {"to": "Psalm 89:13", "l": "E", "note": ""}, {"to": "Isaiah 6:3", "l": "E", "note": ""}, {"to": "Psalm 91:1", "l": "E", "note": ""}, {"to": "Psalm 40:2", "l": "E", "note": ""}, {"to": "Matthew 6:13", "l": "E", "note": ""}, {"to": "Matthew 25:10", "l": "E", "note": ""}, {"to": "Matthew 25:33", "l": "E", "note": ""}, {"to": "Matthew 13:43", "l": "E", "note": ""}, {"to": "Revelation 19:9", "l": "E", "note": ""}]}, {"id": "trinity", "part": "Prayer and Incense", "name": "Praise to the Trinity", "slides": [37], "kids": "We say 'Holy' to God the Father, God the Son and God the Holy Spirit: three persons, one God.", "teens": "A short confession of the Trinity. Jesus told us to baptise 'in the name of the Father, and of the Son, and of the Holy Ghost' (Matthew 28:19), and the threefold 'holy' echoes Isaiah 6.", "action": "Priest and congregation alternate.", "discuss": "Why do you think the liturgy keeps coming back to the number three?", "slideData": [{"n": 37, "title": "Praise to the Trinity", "text": "P. \tMay we always receive from God, the redemption of our debts and forgiveness of our sins.\nC. \tAmen.\nP. \tWeak and sinful as we are, let us confess and say together, Holy is the Holy Father.\nC.\tAmen.\nP. \tHoly is the Holy Son.\nC. \tAmen.\nP. \tHoly is the living and Holy Spirit.\nAmen.", "why": "Holy Father, holy Son, holy Spirit: the one God into whose name we are baptised.", "links": [{"to": "Matthew 28:19", "l": "S"}, {"to": "Isaiah 6:3", "l": "E"}]}], "links": [{"to": "Isaiah 6:3", "l": "E", "note": ""}, {"to": "Matthew 28:19", "l": "S", "note": ""}]}, {"id": "creed", "part": "Faith and Response", "name": "The Nicene Creed", "slides": [38, 39, 40], "kids": "We say together what we believe about God. It's like the church's summary of the whole Bible.", "teens": "The Creed was written by the councils of Nicaea (325) and Constantinople (381) to sum up what Scripture teaches. Almost every line has a Bible source: John 1 for 'by whom all things were made', 1 Corinthians 15 for 'rose again the third day', and Ephesians 4 for 'one baptism'.", "action": "Everyone stands and says it together.", "discuss": "Pick one line of the Creed. Can you find the Bible verse behind it?", "slideData": [{"n": 38, "title": "The Nicene Creed", "text": "D. ‘Wisdom cries aloud’. Let us all stand in reverence and affirm together with our respected priest/father in God.\nWe believe in the one true God, the Father Almighty;\nMaker of heaven and earth and of all things visible and invisible.\nWe believe in one Lord Jesus Christ, the only-begotten Son of God, begotten of the Father before all worlds; Light of light, very God of very God; begotten not made, being of One substance with the Father, by whom all things were made; …", "why": "'Wisdom crieth without' is Proverbs 1:20. The Creed was written by the early church councils to sum up what Scripture teaches about God.", "links": [{"to": "Proverbs 1:20", "l": "Q"}, {"to": "John 1:1-3", "l": "E"}, {"to": "councils", "l": "T"}]}, {"n": 39, "title": "The Nicene Creed", "text": "who for us and for our salvation, came down from heaven and was incarnate by the Holy Spirit, of the Virgin Mary and was made man; He was crucified also for us in the days of Pontius Pilate; He suffered and died and was buried; on the third day He rose again by His own holy will, ascended into heaven and sits at the right hand of the Father; He shall come again with glory, to judge both the living and the dead; and of His kingdom, there will be no end. …", "why": "Died, buried, rose the third day 'according to the scriptures' (1 Corinthians 15). Ascended (Acts 1). Will judge the living and the dead (2 Timothy 4).", "links": [{"to": "1 Corinthians 15:3-4", "l": "E"}, {"to": "Acts 1:9-11", "l": "E"}, {"to": "2 Timothy 4:1", "l": "E"}]}, {"n": 40, "title": "The Nicene Creed", "text": "We believe in the Holy Spirit, the Lord and giver of life; who proceeds from the Father; who with the Father and the Son together, is worshipped and glorified; who spoke by the prophets and the apostles.\nWe believe in one holy catholic and apostolic Church.\nWe acknowledge one baptism for the forgiveness of sins and look forward to the resurrection of the dead and the new life of the world to come. Amen.\nD.\tBless us O Lord. Let us stand reverently.\nC.\tLord, have mercy.", "why": "One body, one Spirit, one baptism (Ephesians 4). The Spirit spoke through the prophets (2 Peter 1:21) and proceeds from the Father (John 15:26).", "links": [{"to": "Ephesians 4:4-6", "l": "E"}, {"to": "2 Peter 1:21", "l": "E"}, {"to": "John 15:26", "l": "E"}]}], "links": [{"to": "Proverbs 1:20", "l": "Q", "note": ""}, {"to": "John 1:1-3", "l": "E", "note": ""}, {"to": "1 Corinthians 15:3-4", "l": "E", "note": ""}, {"to": "Acts 1:9-11", "l": "E", "note": ""}, {"to": "2 Timothy 4:1", "l": "E", "note": ""}, {"to": "Ephesians 4:4-6", "l": "E", "note": ""}, {"to": "2 Peter 1:21", "l": "E", "note": ""}, {"to": "John 15:26", "l": "E", "note": ""}, {"to": "councils", "l": "T", "note": ""}]}, {"id": "offertory", "part": "Faith and Response", "name": "Offertory", "slides": [45], "kids": "We give gifts to God because He has given us everything.", "teens": "Giving is worship. 'God loveth a cheerful giver' (2 Corinthians 9:7), and the gift stands for offering our whole selves (Romans 12:1).", "action": "Gifts are collected during the offertory hymn.", "discuss": "Besides money, what else could you offer to God this week?", "slideData": [{"n": 45, "title": "Offertory Hymn", "text": "<Insert the Lyrics of the Offertory Hymn>", "why": "God loves a cheerful giver. Our gifts stand for offering our whole lives to God.", "links": [{"to": "2 Corinthians 9:7", "l": "S"}, {"to": "Romans 12:1", "l": "S"}]}], "links": [{"to": "2 Corinthians 9:7", "l": "S", "note": ""}, {"to": "Romans 12:1", "l": "S", "note": ""}]}, {"id": "sermon", "part": "Faith and Response", "name": "Sermon", "slides": [47], "kids": "The achen explains the Bible readings so we can understand them and live them out.", "teens": "When Ezra's helpers read the law, they 'gave the sense' so people understood (Nehemiah 8:8). Paul told Timothy to 'Preach the word' (2 Timothy 4:2). The sermon follows that pattern.", "action": "The achen preaches on the day's readings.", "discuss": "What's one thing from today's sermon you could do before next Sunday?", "slideData": [{"n": 47, "title": "Sermon", "text": "<Insert the Slides for the Sermon>", "why": "Ezra's helpers read the law and 'gave the sense' so people understood. Paul: 'Preach the word'.", "links": [{"to": "Nehemiah 8:8", "l": "C"}, {"to": "2 Timothy 4:2", "l": "C"}]}], "links": [{"to": "Nehemiah 8:8", "l": "C", "note": ""}, {"to": "2 Timothy 4:2", "l": "C", "note": ""}, {"to": "synagogue", "l": "S", "note": "Reading followed by explanation is the synagogue pattern"}]}];

const EVENTS = [{"id": "ev-birth", "name": "Birth", "short": "Born of Mary", "kids": "God's Son became a real baby, born to Mary, so He could be one of us.", "teens": "The incarnation: God took on human flesh. The liturgy repeats it again and again, so we never forget that God came close.", "bible": ["Luke 2:6-7", "John 1:14", "Isaiah 7:14"], "lit": [[14, "in Your grace, You became incarnate of the blessed Virgin Mary, for the life and salvation of all humanity"], [22, "God incarnate of the blessed Virgin Mary"], [31, "You took flesh of the blessed Virgin Mary and became incarnate for our sake"], [39, "came down from heaven and was incarnate by the Holy Spirit, of the Virgin Mary and was made man"]], "later": [[122, "Meditation after Communion: 'wrapped in cloth and laid in a manger'"]]}, {"id": "ev-baptism", "name": "Baptism", "short": "In the river Jordan", "kids": "Jesus was baptised in the river. The Father spoke from heaven and the Spirit came down like a dove.", "teens": "At the baptism, all three persons of the Trinity show up together: the Son in the water, the Spirit as a dove, the Father's voice. The very first words of the Ante-Communion remember it.", "bible": ["Matthew 3:16-17", "Mark 1:9-11"], "lit": [[14, "O Lord Jesus Christ, incarnate of Mary and baptised by John, shower Your blessings on us."]], "later": [[122, "Meditation after Communion: 'received baptism in the river Jordan'"]]}, {"id": "ev-ministry", "name": "Public Ministry", "short": "The Gospel read aloud", "kids": "Jesus taught people about God and healed them. Every Sunday we stand up and hear His own words read from the Gospel.", "teens": "The Gospel reading is where Jesus' ministry is remembered most directly. Notice the introduction: 'In the days of Jesus… it happened in this way / He taught in this manner.' We hear the actual event or teaching, every week.", "bible": ["Mark 1:14-15", "Luke 4:18", "John 8:12"], "lit": [[22, "In the days of Jesus the Christ our Lord God and Saviour, the ible": ["John 19:30", "1 Corinthians 15:3", "Hebrews 2:14"], "lit": [[14, "trampled our death by Your death and destroyed it forever"], [39, "He suffered and died"]], "later": [[62, "'you proclaim the Lord's death until He comes'"], [62, "'Your death O Lord, we commemorate'"], [63, "Remembrance: 'we remember Your death'"]]}, {"id": "ev-burial", "name": "Burial", "short": "Laid in the tomb", "kids": "Jesus' body was wrapped in cloth and laid in a tomb cut out of rock. His friends thought it was the end.", "teens": "The burial matters because it shows Jesus was really dead. Paul lists it as part of the core gospel: He died, He was buried, He rose (1 Corinthians 15:3-4).", "bible": ["Matthew 27:59-60", "1 Corinthians 15:4"], "lit": [[39, "and was buried"]], "later": [[63, "Remembrance: 'Your death, burial and resurrection'"], [122, "'was laid in a tomb'"]]}, {"id": "ev-resurrection", "name": "Resurrection", "short": "Risen on the third day", "kids": "On the third day, Jesus came back to life! That's why we worship on Sunday, the day He rose.", "teens": "Every Sunday is a small Easter. Before the sermon, the Creed confesses it. Afterwards the Words of Institution ('Your resurrection, we celebrate') and the Remembrance prayer return to it.", "bible": ["Luke 24:5-6", "Matthew 28:6"], "lit": [[39, "on the third day He rose again by His own holy will"]], "later": [[62, "'Your resurrection, we celebrate'"], [63, "'resurrection on the third day'"], [104, "'death has been abolished through Your resurrection'"]]}, {"id": "ev-ascension", "name": "Ascension", "short": "At the right hand", "kids": "Jesus went back up to heaven. He is with the Father now, and He hears our prayers.", "teens": "The ascension means Jesus now reigns. It's why, later in the service, the priest says to lift our minds to 'the right hand of God the Father, where Christ the Lord has ascended'.", "bible": ["Acts 1:9", "Mark 16:19"], "lit": [[39, "ascended into heaven and sits at the right hand of the Father"]], "later": [[58, "First Blessing: 'where Christ the Lord has ascended'"], [63, "'Your ascension into heaven'"]]}, {"id": "ev-return", "name": "Second Coming", "short": "He will come again", "kids": "Jesus promised to come back. When He does, there will be a huge feast, and everyone who loves Him is invited.", "teens": "Worship looks forward as well as back. The Gospel response says 'Blessed is He who has come and is to come again'. The Sedra pictures the wedding feast, and the Creed promises 'of His kingdom, there will be no end'.", "bible": ["Acts 1:11", "Matthew 25:31", "Revelation 19:9"], "lit": [[22, "Blessed is He who has come and is to come again."], [35, "on the day when Your magnificence is revealed, make us radiant together with the saints and the chosen ones, and give us a place on Your right at that divine banquet"], [39, "He shall come again with glory, to judge both the living and the dead; and of His kingdom, there will be no end"]], "later": [[62, "'Your second coming we await'"], [63, "'We also look forward to Your second coming'"]]}];
const STEPS = {"entering": ["You pray quietly as you enter, before the service begins.", "Luke 15:20", "We come in like the prodigal son coming home, trusting the Father to run out and welcome us."], "lessons": ["Two readers read from the Old Testament and the New Testament.", "Luke 24:27", "Jesus said the whole Bible points to Him, so we hear both Testaments side by side."], "light": ["Priest and people sing to Jesus, the Light.", "Psalm 36:9", "The first line quotes Psalm 36:9. The early church read it as a picture of the Trinity: the Son's light, from the Father's light, in the light of the Spirit."], "antecommunion": ["The priest begins, and everyone responds with a hymn about who Jesus is.", "John 1:14", "In a few lines it tells the whole story: God's Son became human, was crucified for us, and defeated death."], "trisagion": ["Everyone says \"Holy art Thou\" three times.", "Isaiah 6:3", "We join the angels' song from Isaiah 6. The line \"crucified for us\" turns heaven's holiness toward the cross."], "epistle": ["The deacon announces it, and a letter from an apostle is read.", "Colossians 4:16", "Paul asked for his letters to be read aloud in the churches. We are still doing what he asked."], "gospel": ["Everyone stands, and the priest reads from the Gospel.", "Nehemiah 8:5", "We stand for Jesus' own words and story, as Israel stood when God's word was opened."], "promeon": ["The priest offers incense and prays for forgiveness.", "Psalm 141:2", "Rising smoke is the Bible's own picture of our prayers rising to God."], "hosoyo": ["The priest prays for mercy for everyone: our families, our clergy, the whole church.", "Psalm 51:1", "Like David in Psalm 51, we ask God for mercy, and we ask together, not alone."], "sedra": ["A long prayer pictures heaven's worship and asks Jesus to keep us safe.", "Revelation 4:8", "It quotes the angels' song in Revelation and ends at the great feast Jesus promised."], "trinity": ["Priest and people say \"Holy\" to the Father, the Son and the Holy Spirit.", "Matthew 28:19", "One God in three persons: the name we were baptised into."], "creed": ["Everyone stands and says together what we believe.", "1 Corinthians 15:3-4", "The Creed sums up the Bible's story of Jesus: born, crucified, buried, risen, ascended, and coming again."], "offertory": ["Gifts are collected during a hymn.", "2 Corinthians 9:7", "Giving is worship: a sign that we offer our whole lives to God."], "sermon": ["The achen explains the day's readings.", "Nehemiah 8:8", "Like Ezra's helpers, the preacher \"gives the sense\" so we understand God's word and live it."]};

r, for the whole family of the church.", "watch": "When you hear 'our families', think of your own family by name."}, "sedra": {"words": [32, "Holy, Holy, Holy, is the Lord God Almighty"], "decoys": [["Luke 2:13-14", "Angels sing 'Glory to God in the highest'"], ["Psalm 148:2", "Praise ye him, all his angels"]], "keydesc": "Around the throne they never stop: 'Holy, holy, holy, Lord God Almighty'", "pos": 2, "q": "The Sedra ends with a picture of the future. What is it?", "opts": ["A great feast with Jesus", "A storm at sea", "A long journey"], "ans": 0, "explain": "It asks for a place 'at that divine banquet', the wedding feast Jesus promised (Revelation 19:9).", "watch": "Count the Bible pictures in this prayer: angels, a shelter, a feast…"}, "trinity": {"words": [37, "Holy is the Holy Father."], "decoys": [["Genesis 12:1", "God calls Abraham to a new land"], ["John 3:16", "God so loved the world"]], "keydesc": "Baptise in the name of the Father, Son and Holy Spirit", "pos": 0, "q": "We say 'Holy' to which persons?", "opts": ["Father, Son and Holy Spirit", "Mary, Joseph and Jesus", "Peter, James and John"], "ans": 0, "explain": "One God in three persons: the name every Christian is baptised into.", "watch": "Notice the same pattern of three in the blessings later in the service."}, "creed": {"words": [38, "We believe in the one true God, the Father Almighty;"], "decoys": [["Micah 6:8", "Do justly, love mercy, walk humbly with God"], ["Ecclesiastes 3:1", "To every thing there is a season"]], "keydesc": "Christ died, was buried, and rose the third day", "pos": 1, "q": "Which of these is NOT in the Creed?", "opts": ["Born of the Virgin Mary", "Rose again on the third day", "Walked on water"], "ans": 2, "explain": "The Creed sums up the saving events: birth, cross, death, burial, resurrection, ascension, and His coming again.", "watch": "As you say the Creed, count on your fingers each event of Jesus' life you name."}, "offertory": {"words": null, "decoys": [["Matthew 6:34", "Take no thought for the morrow"], ["Ruth 1:16", "Whither thou goest, I will go"]], "keydesc": "God loves a cheerful giver", "pos": 2, "q": "According to Paul, how should we give?", "opts": ["Cheerfully, from the heart", "Only when people are watching", "Only large amounts"], "ans": 0, "explain": "2 Corinthians 9:7: not grudgingly or under pressure. Giving is worship.", "watch": "When the offering comes, offer one more thing besides money: your time, a habit, or a worry."}, "sermon": {"words": null, "decoys": [["Psalm 19:1", "The heavens declare the glory of God"], ["Exodus 14:21", "Moses parts the Red Sea"]], "keydesc": "Ezra's helpers read the law and explained its meaning", "pos": 0, "q": "In Nehemiah 8:8, what did Ezra's helpers do after reading?", "opts": ["Gave the sense, so people understood", "Sent everyone home", "Read it again, louder"], "ans": 0, "explain": "Reading and explaining go together. The sermon helps us understand and live what we heard.", "watch": "Write down one sentence from the sermon that you could act on this week."}};
const DEEP = {"trisagion": {"title": "Trace the root: Holy, holy, holy", "chain": [["The root", "Old Testament", "Isaiah 6:1-3", "In the year that king Uzziah died I saw also the Lord sitting upon a throne, high and lifted up… And one cried unto another, and said, Holy, holy, holy, is the LORD of hosts: the whole earth is full of his glory.", "Isaiah sees God in the temple. The angels cry 'holy' three times."], ["Fulfilled in Jesus", "Gospel", "John 12:41", "These things said Esaias, when he saw his glory, and spake of him.", "John says the glory Isaiah saw was Jesus' glory. The One on the throne is the One we meet in Christ."], ["In heaven now", "Revelation", "Revelation 4:8", "…and they rest not day and night, saying, Holy, holy, holy, Lord God Almighty, which was, and is, and is to come.", "The song Isaiah heard has never stopped."], ["In our worship", "Slide 15", null, "Holy art Thou, O God. Holy art Thou, Almighty Lord. Holy art Thou, Immortal Lord. O Lord the Messiah who was crucified for us, have mercy on us.", "We join that same song, and add the cross. The holy God came close enough to die for us."]], "words": [["Trisagion", "Greek: tris (three times) + hagios (holy). 'Thrice holy'."], ["Qadosh", "The Hebrew word the angels sing in Isaiah 6. It means holy: set apart, completely different from anything else."]], "history": "The Trisagion is one of the oldest hymns of the church, sung in the East from about the 400s. In the Syriac tradition, the line 'who was crucified for us' is added, so the hymn is sung to Christ.", "think": "Isaiah's first response to God's holiness was 'Woe is me!' (Isaiah 6:5). His last was 'Here am I; send me' (Isaiah 6:8). Where are you between those two right now?"}, "gospel": {"title": "Trace the root: Standing for the Word", "chain": [["The root", "Old Testament", "Nehemiah 8:5-6", "And Ezra opened the book in the sight of all the people… and when he opened it, all the people stood up: And Ezra blessed the LORD, the great God. And all the people answered, Amen, Amen…", "After exile, God's people gather to hear His word. They stand, and they answer 'Amen'."], ["Fulfilled in Jesus", "Gospel", "Luke 4:16-21", "…he went into the synagogue on the sabbath day, and stood up for to read… And he began to say unto them, This day is this scripture fulfilled in your ears.", "Jesus stands to read Isaiah, then says it is about Him. He is what the reading is about."], ["Why the Gospels were written", "Gospel", "John 20:31", "But these are written, that ye might believe that Jesus is the Christ, the Son of God; and that believing ye might have life through his name.", "The Gospels exist so that we would believe and have life."], ["In our worship", "Slides 22 and 25", null, "Blessed is He who has come and is to come again… So we believe and affirm.", "We stand, as Israel stood. Before the reading, we say we believe it. Afterwards we thank God for 'the Light of the world'."]], "words": [["Gospel", "Old English godspel, 'good news'. It translates the Greek euangelion: eu (good) + angelion (message)."], ["Hallelujah", "Hebrew: hallelu (praise) + Yah (the LORD). 'Praise the LORD'. We sing it just before the Gospel."]], "history": "Reading Scripture aloud in worship comes from the synagogue, where the Law and the Prophets were read every Sabbath (Acts 13:15). The church kept the pattern and gave the Gospel the place of honour: the priest reads it and everyone stands.", "think": "Jesus said, 'This day is this scripture fulfilled in your ears.' What would it look like for this Sunday's Gospel to come true in your week?"}};
const STAGES = ["On Sunday","Your guess","Why it matters","Quick check","This Sunday"];
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const bg = r => "https://www.biblegateway.com/passage/?search="+encodeURIComponent(r)+"&version=KJV";
MOMENTS.forEach(m=>{const s=new Set(m.slides);m.events=EVENTS.filter(e=>e.lit.some(([n])=>s.has(n)));});

// progress, kept in this browser only
let done = new Set();
try{ done = new Set(JSON.parse(localStorage.getItem("rooted-done")||"[]")); }catch(e){}
function save(){ try{ localStorage.setItem("rooted-done", JSON.stringify([...done])); }catch(e){} }

const st = {view:"home", i:0, stage:0, guess:null, check:null};
const app = document.getElementById("app");

function evChips(list, litOnly){
  return EVENTS.map(e=>{
    const on = MOMENTS.some(m=>done.has(m.id)&&m.events.includes(e));
    return `<span class="ev ${on?"on":""} ${e.lit.length?"":"later"}" title="${e.lit.length?"":"Remembered after the sermon"}">${esc(e.name)}</span>`;
  }).join("");
}

function home(){
  const next = MOMENTS.findIndex(m=>!done.has(m.id));
  let parts="", part=null;
  MOMENTS.forEach((m,i)=>{
    if(m.part!==part){part=m.part;parts+=`<div class="part">${esc(part)}</div>`;}
    const isDone=done.has(m.id), isNext=i===next;
    parts+=`<button class="lesson ${isDone?"done":""} ${isNext?"next":""}" data-open="${i}">
      <span class="dot">${isDone?"✓":i+1}</span>
      <span><span class="t">${esc(m.name)}${DEEP[m.id]?'<span class="pill">Deep dive</span>':""}</span><br><span class="s">${esc(STEPS[m.id][0])}</span></span>
      <span class="go">${isDone?"Review":isNext?"Start →":""}</span></button>`;
  });
  const n=done.size, total=MOMENTS.length;
  app.innerHTML=`
    <div class="eyebrow">Mar Thoma Holy Qurbana · Part 1: Entering to Sermon</div>
    <h1>Why do we do that on Sunday?</h1>
    <p class="lead">${total} short lessons, about 5 minutes each. Each one takes one part of the service, shows where it comes from in the Bible, and gives you something to watch for next Sunday.</p>
    <div class="hero">
      <div class="progress"><b>${n}</b> of <b>${total}</b> lessons done</div>
      ${next>=0?`<button class="btn" data-open="${next}">${n?"Continue":"Start lesson 1"} →</button>`:`<span class="progress"><b>Part 1 complete.</b> Part 2 (the Holy Communion) is coming.</span>`}
    </div>
    <section class="card story">
      <h2>The story of Jesus in our worship</h2>
      <p>Every Sunday, the service remembers Jesus' whole life. Finish lessons to uncover where.</p>
      <div class="evrow">${evChips()}</div>
    </section>
    <section class="path">${parts}</section>
    <footer>Draft for review by Mar Thoma clergy. Liturgy text from the parish's English Order of Worship (Liturgy of St James). Bible text: King James Version (public domain). Your progress is saved only in this browser.</footer>`;
}

function stageHTML(m){
  const [act,key,why]=STEPS[m.id], L=LEARN[m.id];
  if(st.stage===0){
    return `<h2>${esc(m.name)}</h2><p class="big">${esc(act)}</p>
      ${L.words?`<div class="words"><q>${esc(L.words[1])}</q><small>From the liturgy, slide ${L.words[0]}</small></div>`:""}`;
  }
  if(st.stage===1){
    const opts=[...L.decoys]; opts.splice(L.pos,0,[key,L.keydesc]);
    const answered=st.guess!==null;
    return `<h2>Where in the Bible does this come from?</h2><p style="margin:0;color:var(--muted)">Pick the passage you think is behind it.</p>
      <div class="opts">${opts.map(([r,d],i)=>{
        let cls=""; if(answered){ if(i===L.pos)cls="right"; else if(i===st.guess)cls="wrong"; }
        return `<button class="opt ${cls}" data-guess="${i}" ${answered?"disabled":""}><b>${esc(r)}</b><span>${esc(d)}</span></button>`;}).join("")}</div>
      ${answered?`<div class="feedback ${st.guess===L.pos?"good":"bad"}"><strong>${st.guess===L.pos?"That's it.":"Not quite. It's "+esc(key)+"."}</strong></div>
        <div class="verse"><q>${esc(KJV[key]||"")}</q><div class="ref">${esc(key)}<a href="${bg(key)}" target="_blank" rel="noopener">Read the passage ↗</a></div></div>`:""}`;
  }
  if(st.stage===2){
    const more=m.links.filter(x=>/\d+:\d+/.test(x.to)&&x.to!==key).map(x=>x.to);
    return `<h2>Why it matters</h2><p class="big">${esc(why)}</p><p style="margin:0">${esc(m.teens)}</p>
      <details class="deeper"><summary>See the full words we pray</summary>
        ${m.slideData.map(s=>`<div class="lit"><span class="sn">Slide ${s.n}</span>\n${/^<Insert/.test(s.text.trim())?"<em>This week's reading goes here.</em>":esc(s.text).split("\n").map(l=>/^\s*P\./.test(l)?`<span class="P">${l}</span>`:l).join("\n")}</div>`).join("")}
        ${more.length?`<p style="margin:10px 0 0;font-weight:700">More Bible connections</p><ul class="more">${more.map(r=>`<li><a href="${bg(r)}" target="_blank" rel="noopener">${esc(r)}</a></li>`).join("")}</ul>`:""}
      </details>`;
  }
  if(st.stage===3){
    const answered=st.check!==null;
    return `<h2>${esc(L.q)}</h2>
      <div class="opts">${L.opts.map((o,i)=>{let cls="";if(answered){if(i===L.ans)cls="right";else if(i===st.check)cls="wrong";}
        return `<button class="opt ${cls}" data-check="${i}" ${answered?"disabled":""}><b>${esc(o)}</b></button>`;}).join("")}</div>
      ${answered?`<div class="feedback ${st.check===L.ans?"good":"bad"}"><strong>${st.check===L.ans?"Right.":"Not quite."}</strong>${esc(L.explain)}</div>`:""}`;
  }
  const evs=m.events;
  return `<h2>This Sunday, watch for this</h2><div class="watch">${esc(L.watch)}</div>
    ${evs.length?`<div class="unlock">This part of the service remembers:<br>${evs.map(e=>`<span class="ev on">${esc(e.name)}</span>`).join("")}</div>`:""}
    <p class="talk"><b>Talk about it with a friend:</b> ${esc(m.discuss)}</p>
    ${DEEP[m.id]?`<div class="deepcta"><p><b>Want to go deeper?</b><br>Trace this back through the whole Bible.</p><button class="btn altar" data-deep="${st.i}">Deep dive →</button></div>`:""}`;
}

function player(){
  const m=MOMENTS[st.i];
  const canNext = (st.stage===1&&st.guess===null)||(st.stage===3&&st.check===null) ? false : true;
  const last=st.stage===STAGES.length-1;
  app.innerHTML=`
    <div class="topbar"><button class="back" id="home">← All lessons</button>
      <div class="bar" aria-label="Lesson progress">${STAGES.map((s,i)=>`<i class="${i<=st.stage?"on":""}"></i>`).join("")}</div>
      <span style="font-size:.85rem;color:var(--muted)">${st.i+1}/${MOMENTS.length}</span></div>
    <section class="card player" aria-live="polite">
      <div class="stage-label">${STAGES[st.stage]}</div>
      ${stageHTML(m)}
      <div class="nav">
        ${st.stage>0?`<button class="btn ghost" id="prev">Back</button>`:""}
        <button class="btn" id="next" ${canNext?"":"disabled"}>${last?(st.i<MOMENTS.length-1?"Finish · next lesson →":"Finish"):(!canNext?"Choose an answer":"Next →")}</button>
      </div>
    </section>`;
}

function deep(){
  const m=MOMENTS[st.i], d=DEEP[m.id];
  app.innerHTML=`
    <div class="topbar"><button class="back" id="backlesson">← Back to lesson</button></div>
    <section class="card">
      <div class="stage-label">Deep dive · ${esc(m.name)}</div>
      <h2 style="font-family:var(--display);font-size:clamp(1.6rem,6vw,2.1rem);line-height:1.1;margin:0 0 6px">${esc(d.title)}</h2>
      <p style="margin:0 0 12px;color:var(--muted)">One thread, from the Old Testament to Jesus to our Sunday worship.</p>
      <div class="chain">${d.chain.map(([k,src,ref,quote,note])=>`
        <div class="link ${ref?"":"ours"}"><span class="k">${esc(k)}</span><span class="r">${ref?`<a href="${bg(ref)}" target="_blank" rel="noopener">${esc(ref)}</a>`:esc(src)}</span>
          <q>${esc(quote)}</q><p>${esc(note)}</p></div>`).join("")}</div>
      <div class="box"><h3>Word study</h3><dl>${d.words.map(([w,x])=>`<dt>${esc(w)}</dt><dd>${esc(x)}</dd>`).join("")}</dl></div>
      <div class="box"><h3>From history</h3><p>${esc(d.history)}</p></div>
      <div class="box" style="background:var(--altar-soft)"><h3>Think deeper</h3><p>${esc(d.think)}</p></div>
      <p class="review">Draft. Word meanings and history to be confirmed by a scholar.</p>
      <div class="nav"><button class="btn ghost" id="backlesson2">Back to lesson</button><button class="btn" id="home">All lessons</button></div>
    </section>`;
}
function render(){ st.view==="home"?home():st.view==="deep"?deep():player(); window.scrollTo(0,0); }
function open(i){ st.view="player"; st.i=i; st.stage=0; st.guess=null; st.check=null; render(); }

app.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.open!==undefined) return open(+t.dataset.open);
  if(t.id==="home"){ st.view="home"; return render(); }
  if(t.dataset.deep!==undefined){ st.view="deep"; return render(); }
  if(t.id==="backlesson"||t.id==="backlesson2"){ st.view="player"; return render(); }
  if(t.dataset.guess!==undefined){ st.guess=+t.dataset.guess; return player(); }
  if(t.dataset.check!==undefined){ st.check=+t.dataset.check; return player(); }
  if(t.id==="prev"){ st.stage--; return render(); }
  if(t.id==="next"){
    if(st.stage<STAGES.length-1){ st.stage++; return render(); }
    done.add(MOMENTS[st.i].id); save();
    if(st.i<MOMENTS.length-1) return open(st.i+1);
    st.view="home"; return render();
  }
});
render();
</script>
</body>
</html>
